name: MISA Driver Shifts

# Dispatched by the daily 05:00 VN Vercel cron (/api/schedule-job) and the
# dashboard's Đồng Bộ Thông Tin → MISA option (/api/misa-sync). No separate schedule here.
# Also runnable by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      month:
        description: "Target month as YYYY-MM (blank = payroll history through next month, VN time)"
        required: false
        type: string
      sync_master:
        description: "Also refresh Cartrack and Labcenter (enabled by the morning cron)"
        required: false
        type: boolean
        default: false

      skip_misa:
        description: "Refresh Master data only when MISA is already running or cooling down"
        required: false
        type: boolean
        default: false

concurrency:
  group: misa-shifts
  cancel-in-progress: false

jobs:
  master-info:
    if: ${{ inputs.sync_master }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh Cartrack and Labcenter into Supabase and reload config
        run: node dashboard/scripts/sync-master.mjs

  fetch:
    if: ${{ !inputs.skip_misa }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: misa-fetcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Reuse the MISA session between runs when still valid (fewer logins /
      # "new device" notifications). A stale state is harmless — the script
      # probes it and falls back to a fresh login automatically.
      - name: Restore session state
        uses: actions/cache/restore@v4
        with:
          path: misa-fetcher/.state
          key: misa-session-${{ github.run_id }}
          restore-keys: misa-session-

      - name: Fetch shifts and replace Supabase schedule
        run: node fetch-shifts.mjs ${{ inputs.month && format('--month={0}', inputs.month) || '' }}
        env:
          MISA_USERNAME: ${{ secrets.MISA_USERNAME }}
          MISA_PASSWORD: ${{ secrets.MISA_PASSWORD }}
          MISA_TOTP_SECRET: ${{ secrets.MISA_TOTP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # The Supabase writes above must finish before either cache is invalidated.
      # This also updates the assign engine if the dashboard tab was closed.
      - name: Refresh dashboard config and leave caches
        run: |
          curl --fail --silent --show-error --retry 3 --output /dev/null https://diag-logistics.vercel.app/api/config
          curl --fail --silent --show-error --retry 3 --output /dev/null 'https://diag-logistics.vercel.app/api/leave-status?fresh=1'

      - name: Save session state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: misa-fetcher/.state
          key: misa-session-${{ github.run_id }}

      - name: Upload debug dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misa-shifts-dump
          path: misa-fetcher/out/
          retention-days: 7
          if-no-files-found: ignore
