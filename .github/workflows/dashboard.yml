# Fleet Dashboard - Manual Deployment
#
# The auto-assign workflow handles scheduled dashboard deployments (every ~30 min).
# This workflow is for manual one-off deploys or when only dashboard code changes.
#
# No API credentials are injected into the HTML.
# Data is baked in at build time from the API (server-side only).

name: Deploy Fleet Dashboard

on:
  push:
    branches: [master]
    paths:
      - 'generate_dashboard.py'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests

      # Fetch existing activity log from GitHub Pages
      - name: Fetch existing activity log
        run: |
          mkdir -p docs
          curl -sL "https://ol0kat.github.io/auto-assign/activity_log.json" \
            -o docs/activity_log.json || echo "[]" > docs/activity_log.json

      - name: Generate dashboard HTML
        env:
          CARTRACK_AUTH: ${{ secrets.CARTRACK_AUTH }}
          CARTRACK_COOKIE: ${{ secrets.CARTRACK_COOKIE }}
          CARTRACK_DRIVERS_AUTH: ${{ secrets.CARTRACK_DRIVERS_AUTH }}
          CARTRACK_DRIVERS_COOKIE: ${{ secrets.CARTRACK_DRIVERS_COOKIE }}
        run: python generate_dashboard.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - uses: actions/deploy-pages@v4
        id: deployment
