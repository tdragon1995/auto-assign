# Fleet Dashboard - GitHub Pages Deployment
#
# HOW TO SET UP:
# 1. Go to repo Settings > Secrets and variables > Actions
# 2. Add these secrets:
#    - CARTRACK_AUTH         : Prod auth header ("Basic Q05HVDAwMDAy...")
#    - CARTRACK_COOKIE       : Prod cookie (optional)
#    - CARTRACK_DRIVERS_AUTH : Drivers auth header (optional, uses CARTRACK_AUTH if not set)
#    - CARTRACK_DRIVERS_COOKIE : Drivers cookie (optional)
#
# 3. Go to Settings > Pages > Source > select "GitHub Actions"
#
# The HTML is deployed once. It fetches live data every 15s via JavaScript.

name: Deploy Fleet Dashboard

on:
  push:
    branches: [master]
    paths:
      - 'generate_dashboard.py'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests

      - name: Generate dashboard HTML
        env:
          CARTRACK_AUTH: ${{ secrets.CARTRACK_AUTH }}
          CARTRACK_COOKIE: ${{ secrets.CARTRACK_COOKIE }}
          CARTRACK_DRIVERS_AUTH: ${{ secrets.CARTRACK_DRIVERS_AUTH }}
          CARTRACK_DRIVERS_COOKIE: ${{ secrets.CARTRACK_DRIVERS_COOKIE }}
        run: python generate_dashboard.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - uses: actions/deploy-pages@v4
        id: deployment
