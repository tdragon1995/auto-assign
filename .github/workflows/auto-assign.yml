# Auto-Assign Service + Dashboard Deployment
#
# Runs the headless auto-assign loop (25 min), then regenerates the
# fleet dashboard with fresh data + activity log and deploys to GitHub Pages.
#
# Required secrets:
#   - CARTRACK_AUTH   : Prod Authorization header
#   - CARTRACK_COOKIE : Prod Cookie header (optional)
#   - CARTRACK_DRIVERS_AUTH   : Drivers auth (optional, falls back to CARTRACK_AUTH)
#   - CARTRACK_DRIVERS_COOKIE : Drivers cookie (optional)

name: Auto-Assign Service

on:
  schedule:
    - cron: '*/30 * * * *'   # Every 30 minutes (safety net restart)
  push:
    branches: [master]
    paths:
      - 'auto_assign_headless.py'
      - 'auto_assign.py'
      - 'generate_dashboard.py'
      - '.github/workflows/auto-assign.yml'
  workflow_dispatch:

concurrency:
  group: auto-assign
  cancel-in-progress: false   # Don't kill a running instance

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      # Fetch existing activity log from GitHub Pages (to preserve history)
      - name: Fetch existing activity log
        run: |
          mkdir -p docs
          curl -sL "https://ol0kat.github.io/auto-assign/activity_log.json" \
            -o docs/activity_log.json || echo "[]" > docs/activity_log.json

      - name: Run auto-assign service
        env:
          CARTRACK_AUTH: ${{ secrets.CARTRACK_AUTH }}
          CARTRACK_COOKIE: ${{ secrets.CARTRACK_COOKIE }}
          RUN_MINUTES: '25'
        run: python auto_assign_headless.py

      # Generate dashboard with fresh data + activity log (no credentials in HTML)
      - name: Generate dashboard
        env:
          CARTRACK_AUTH: ${{ secrets.CARTRACK_AUTH }}
          CARTRACK_COOKIE: ${{ secrets.CARTRACK_COOKIE }}
          CARTRACK_DRIVERS_AUTH: ${{ secrets.CARTRACK_DRIVERS_AUTH }}
          CARTRACK_DRIVERS_COOKIE: ${{ secrets.CARTRACK_DRIVERS_COOKIE }}
        run: python generate_dashboard.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - uses: actions/deploy-pages@v4
        id: deployment
